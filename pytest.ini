[pytest]
# testpaths lets a bare `pytest` (no args) from the repo root find the suite — which is how
# editor test runners (VS Code's Test Explorer) and plain CLI invocations call it.
testpaths = tests

# The suite imports the top-level modules directly (conftest.py does `import ingest` before
# any test touches `app`). That only worked implicitly under run_tests.sh, which invokes
# `python3 -m pytest` — the -m form puts the cwd on sys.path. Runners that exec the pytest
# console script instead (the VS Code adapter) don't, and collection died with
# ModuleNotFoundError. Stating the path here makes the dependency explicit and
# invocation-independent rather than an accident of how pytest was started.
#
# tools/ is on the path too: the one-off tools live there (reprice, compare_scoring,
# import_linkedin) but the suite imports them flat, the same way their wrappers reach them via
# `python3 -m tools.X` from the repo root. Listing the directory rather than rewriting the tests
# to `from tools import reprice` keeps the tools importable by either name.
pythonpath = . tools
